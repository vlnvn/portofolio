name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://valensius-alven.vercel.app' }}

    steps:
      - name: Check public routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /work/kairos /work/ayam-kalintang; do
            url="$PRODUCTION_URL$path"
            status="$(curl --location --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$status  $url"
            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "::error title=Production route unavailable::$url returned HTTP $status"
              exit 22
            fi
          done

      - name: Check production security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --location --silent --show-error --max-time 15 --head "$PRODUCTION_URL/")"
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
